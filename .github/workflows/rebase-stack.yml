name: Rebase stack

# When main moves, rebase the stacked branches onto it so their PRs stay
# current. Pushes made with GITHUB_TOKEN do not trigger CI (GitHub blocks
# workflow recursion); set STACK_TOKEN (a PAT with repo scope) to make the
# rebased PRs re-run their checks.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase stack bottom-up
        env:
          TOKEN: ${{ secrets.STACK_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "stack-bot"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set -eu
          prev="origin/main"
          for branch in s1 s2 s3; do
            git checkout -B "$branch" "origin/$branch"
            git rebase "$prev"
            git push --force-with-lease origin "$branch"
            prev="$branch"
          done
      - name: Report conflict
        if: failure()
        run: echo "::error::Rebase failed - resolve conflicts on the reported branch manually"
