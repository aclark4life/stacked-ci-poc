name: CI
on:
  pull_request: # no branches filter: fires for PRs targeting non-default branches (stacked PRs)
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR head branch, not the auto-created merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -v
      - run: echo "PR head: ${{ github.event.pull_request.head.ref }} base: ${{ github.event.pull_request.base.ref }}"
